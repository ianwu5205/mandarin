<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mandarin 中文學習教材</title>
<style>
:root{--bg:#f4f1ea;--ink:#1b2540;--muted:#55627f;--line:#d8d2c4;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#12161f;--ink:#eef2ff;--muted:#a9b6d6;--line:#2a3348;--card:#1b2540}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:40rem;margin:0 auto;padding:3rem 1.25rem 4rem}
h1{margin:0 0 .35rem;font-size:clamp(1.75rem,4vw,2.25rem);line-height:1.2}
.lead{margin:0 0 2rem;color:var(--muted);font-size:1.05rem}
ul{list-style:none;margin:0;padding:0;display:grid;gap:.75rem}
a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.15rem;transition:border-color .15s,transform .15s}
a:hover{border-color:var(--ink);transform:translateY(-1px)}
a:focus-visible{outline:3px solid #2f6bff;outline-offset:2px}
.title{display:block;font-weight:700;font-size:1.15rem}
.desc{display:block;margin-top:.25rem;color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>Mandarin 中文學習教材</h1>
  <p class="lead">靜態 HTML 教材，點開即可使用。</p>
  <ul>
    <li>
      <a href="pages/what-is-hard-pen-calligraphy.html">
        <span class="title">硬筆書法是什麼？</span>
        <span class="desc">硬筆書法是什麼——短介紹（有聲）</span>
      </a>
    </li>
    <li>
      <a href="pages/type-chinese-on-iphone.html">
        <span class="title">用 iPhone 打中文</span>
        <span class="desc">如何在 iPhone 開啟並輸入中文</span>
      </a>
    </li>
  </ul>
</main>
</body>
</html>
