<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>iPhone 中文輸入法教學 | Type Chinese on iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap">
<style>
:root{--bg:#e8f2ff;--ink:#1b2540;--card:#fff;--blue:#2f6bff;--sun:#ffd23f;--mint:#1fb67a;--muted:#55627f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1626;--ink:#eef2ff;--card:#1b2540;--blue:#7ea2ff;--sun:#ffd23f;--mint:#3ddc97;--muted:#a9b6d6}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
body.en{font-family:"Fredoka","Segoe UI",system-ui,sans-serif}
body.en .zh,body:not(.en) .en{display:none}
#deck{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}
section{min-height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;gap:5vw;padding:64px 6vw 48px}
.phone{height:min(76vh,780px);width:auto;max-width:100%;border:7px solid #111;border-radius:34px;background:#111;box-shadow:0 18px 40px rgba(20,40,90,.28)}
.card{background:var(--card);border-radius:26px;padding:28px 30px;max-width:460px;box-shadow:0 8px 24px rgba(20,40,90,.12)}
.badge{display:inline-block;background:var(--blue);color:#fff;font-weight:700;border-radius:999px;padding:4px 16px;font-size:1.05rem;margin-bottom:12px}
h1,h2{margin:0 0 12px;line-height:1.2}
h2{font-size:clamp(1.6rem,3.2vw,2.3rem)}
p{font-size:clamp(1.1rem,1.9vw,1.4rem);line-height:1.65;margin:0 0 12px}
.tip{background:var(--sun);color:#1b2540;border-radius:16px;padding:12px 16px;font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.55;margin-top:6px}
.hero{flex-direction:column;text-align:center}
.hero h1{font-size:clamp(2.2rem,7vw,4.6rem)}
.hero .sub{font-size:clamp(1.1rem,2.6vw,1.7rem);color:var(--muted)}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:18px 0}
.chip{background:var(--card);border-radius:18px;padding:12px 20px;font-size:1.2rem;font-weight:700;box-shadow:0 6px 16px rgba(20,40,90,.12)}
.hint{color:var(--muted);font-size:1rem}
.sum{display:grid;gap:10px;margin:8px 0}
.sum div{background:var(--bg);border-radius:14px;padding:10px 14px;font-size:clamp(1rem,1.7vw,1.2rem);line-height:1.5}
#top{position:fixed;z-index:10;top:0;left:0;right:0;display:flex;justify-content:flex-end;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;pointer-events:none}
#top button{pointer-events:auto}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;background:var(--card);color:var(--ink);box-shadow:0 4px 12px rgba(20,40,90,.2);padding:8px 16px;font-weight:700}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.on{background:var(--blue);color:#fff}
#nav{position:fixed;z-index:10;right:12px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#nav .arrow{width:44px;height:44px;padding:0;font-size:1.2rem}
#dots{display:flex;flex-direction:column;gap:7px;padding:6px 0}
#dots i{width:10px;height:10px;border-radius:50%;background:var(--muted);opacity:.4;cursor:pointer;display:block}
#dots i.cur{background:var(--blue);opacity:1;transform:scale(1.5)}
@media (max-width:820px){
 section{flex-direction:column;gap:18px;padding:60px 18px 28px}
 .phone{height:42vh;border-width:5px;border-radius:26px}
 .card{padding:20px;max-width:560px}
 #nav{right:6px}#nav .arrow{width:38px;height:38px}#dots{display:none}
}
@media (prefers-reduced-motion:reduce){#deck{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="top">
 <button id="bz" class="on" aria-label="中文">中文</button>
 <button id="be" aria-label="English">English</button>
</div>
<div id="nav">
 <button class="arrow" id="up" aria-label="Previous page">▲</button>
 <div id="dots"></div>
 <button class="arrow" id="dn" aria-label="Next page">▼</button>
</div>

{i:'4465',n:1,
 zh:['打開「設定」','在主畫面找到灰色的齒輪圖示，上面寫著 Settings（設定）。','點一下它就可以打開囉！'],
 en:['Open Settings','On your Home Screen, find the gray gear icon called Settings.','Tap it to open.']},
{i:'4466',n:2,
 zh:['點「一般」','在設定裡，最上面的第一個選項就是「一般」（General）。','紅色框框圈起來的地方就是它。'],
 en:['Tap General','In Settings, the very first choice at the top is General.','Look for the red box.']},
{i:'4467',n:3,
 zh:['找到「鍵盤」','手指向上滑，找到有小鍵盤圖示的「鍵盤」（Keyboard），點進去。','它在「字體」的下面。'],
 en:['Find Keyboard','Swipe up until you see Keyboard with a little keyboard icon, then tap it.','It’s right below Fonts.']},
{i:'4468',n:4,
 zh:['再點最上面的「鍵盤」','現在只有 2 個鍵盤：英文和表情符號。我們要再加新的！','請點紅框裡的「鍵盤 2」。'],
 en:['Tap Keyboards again','Right now you only have 2 keyboards: English and Emoji. Let’s add more!','Tap “Keyboards 2” in the red box.']},
{i:'4469',n:5,
 zh:['點「新增鍵盤⋯」','藍色的字「Add New Keyboard」就是「新增鍵盤」的意思。','點下去，會出現很長的語言清單。'],
 en:['Tap Add New Keyboard','The blue words let you add a new keyboard.','A long list of languages will appear.']},
{i:'4470',n:6,
 zh:['選「中文（繁體）」','往下滑找到 Chinese, Traditional（繁體中文）。','小心！它的上面還有 Simplified（簡體），不要選錯喔。'],
 en:['Choose Chinese, Traditional','Scroll down to Chinese, Traditional.','Careful! Chinese, Simplified is right above it. Don’t pick that one.']},
{i:'4471',n:7,
 zh:['勾選 3 種輸入法','請勾這三個：<br>① Zhuyin – Standard（注音）<br>② Handwriting（手寫）<br>③ Pinyin – QWERTY（拼音）<br>勾好以後，按右上角藍色的 ✓ 。','都勾好了才按 ✓ ，不然不會存起來！'],
 en:['Pick 3 keyboards','Tick these three:<br>① Zhuyin – Standard<br>② Handwriting<br>③ Pinyin – QWERTY<br>Then tap the blue ✓ at the top right.','Tap ✓ only after you tick all three, or they won’t be saved!']},
{i:'4472',n:8,
 zh:['設定完成！','現在鍵盤清單變成 5 個：英文、表情符號，還有 3 個新的中文鍵盤。','太棒了！接下來學怎麼用它們。'],
 en:['Setup done!','Your list now has 5 keyboards: English, Emoji, and 3 new Chinese ones.','Awesome! Now let’s learn how to use them.']},
{i:'4473',n:9,
 zh:['用 🌐 切換鍵盤','打開任何可以打字的地方，例如「備忘錄」。<b>用手指按住左下角的地球 🌐</b>，就會跳出選單。','選「繁體注音」、「繁體手寫」或「繁體拼音」。想打英文就選 English (US)。'],
 en:['Switch with the 🌐 key','Open any place where you can type, like Notes. <b>Press and hold the globe 🌐 at the bottom left</b> to open a menu.','Pick Zhuyin, Handwriting, or Pinyin. Choose English (US) to type English again.']},
{i:'4474',
 zh:['注音鍵盤（ㄅㄆㄇ）','這是注音鍵盤。像學國語一樣，一個字一個字拼出聲音。','右上方的 ˊ ˇ ˋ ˙ 是聲調。第一聲不用按，直接按空白鍵。'],
 en:['Zhuyin keyboard (ㄅㄆㄇ)','This keyboard uses the Zhuyin sound symbols you learn in Chinese class.','The marks ˊ ˇ ˋ ˙ are the tones. For the first tone, just press the space bar.']},
{i:'4478',
 zh:['先看「常用字」','打出注音（例如 ㄘˊ）後，鍵盤上方會先出現最常用的字。','看到想要的字，直接點它！找不到的話，按右邊向下的小箭頭 ⌄。'],
 en:['Check the common words first','After you type a sound (like ㄘˊ), the most common characters show up above the keyboard.','Tap the one you want! Can’t find it? Tap the small down arrow ⌄ on the right.']},
{i:'4479',
 zh:['找不到？看更多「候選字」','按了箭頭以後，會跳出一大片候選字。例如打 ㄓ，就有「這、中、只、之」等很多字。','點你要的字。按上面的 ⌃ 箭頭，可以收起來。'],
 en:['Not there? See more choices','After you tap the arrow, a big grid of choices opens. For example, ㄓ shows 這, 中, 只, 之, and many more.','Tap the one you want. Tap the ⌃ arrow at the top to close the grid.']},
{i:'4480',
 zh:['可以連續打','不用打一個字就選一次，可以一直連著打：ㄘ ㄐㄧ ㄓㄨㄥ ㄨ，上面就會猜出「慈濟中文」。','點紅框裡的詞，整串注音就一起變成中文字了！'],
 en:['You can keep typing','You don’t have to pick after every character. Type ㄘ ㄐㄧ ㄓㄨㄥ ㄨ in a row, and the keyboard guesses “慈濟中文.”','Tap the word in the red box, and the whole line turns into Chinese characters!']},
{i:'4475',
 zh:['拼音鍵盤（abc）','這個鍵盤和英文鍵盤長得一樣，用英文字母打出拼音，例如 wo 會變成「我」。','上面的候選字列表，點你要的字。'],
 en:['Pinyin keyboard (abc)','It looks like the English keyboard. Type Pinyin with letters, for example “wo” gives you 我.','Tap the word you want from the list above.']},
{i:'4476',
 zh:['手寫鍵盤','用手指在灰色的區域寫字，一次寫一個字。','上方會猜你寫的字，點對的那一個。不會拼音的字，用寫的最方便！'],
 en:['Handwriting keyboard','Use your finger to write in the gray area, one character at a time.','Guesses appear on top. Tap the right one. Great for characters you don’t know how to pronounce!']},
{i:null,end:1}
];

}
const all=[{hero:1},...S];
deck.innerHTML=all.map((s,k)=>secHTML(s,k)).join('');
all.forEach((_,k)=>{const d=document.createElement('i');d.onclick=()=>go(k);dots.appendChild(d)});
const secs=[...deck.children];
let cur=0;
function go(k){k=Math.max(0,Math.min(secs.length-1,k));secs[k].scrollIntoView({behavior:'smooth',block:'start'})}
function mark(){const y=deck.scrollTop+deck.clientHeight/2;let k=0;secs.forEach((s,i)=>{if(s.offsetTop<=y)k=i});cur=k;[...dots.children].forEach((d,i)=>d.classList.toggle('cur',i===k))}
deck.addEventListener('scroll',mark);mark();
document.getElementById('up').onclick=()=>go(cur-1);
document.getElementById('dn').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{
 if(['ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
 if(['ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
});
function lang(l){document.body.classList.toggle('en',l==='en');document.documentElement.lang=l==='en'?'en':'zh-Hant';
 document.getElementById('bz').classList.toggle('on',l!=='en');document.getElementById('be').classList.toggle('on',l==='en');
 try{localStorage.setItem('lang',l)}catch(e){}}
document.getElementById('bz').onclick=()=>lang('zh');
document.getElementById('be').onclick=()=>lang('en');
let saved=null;try{saved=localStorage.getItem('lang')}catch(e){}
lang(saved==='en'?'en':'zh');
</script>
